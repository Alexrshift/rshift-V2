
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSHIFT — Immersive Experiences</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #06162b;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 6%;
    }
    .brand {
      font-size: 26px;
      letter-spacing: 8px;
      font-weight: 300;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 13px;
    }
   main {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8%;
  gap: 30px;
}
    h1 {
      font-size: clamp(42px, 6vw, 90px);
      font-weight: 300;
      line-height: 1.1;
    }
    .logo {
  width: 450px;
  max-width: 100%;
  height: auto;
  flex-shrink: 0;
}
    @media (max-width: 700px) {
      main { flex-direction: column; text-align: center; }
      nav { display: none; }
      .logo { width: 50%; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <header>
    <div class="brand">
  <img src="rshift-titre.png" alt="RSHIFT" style="width:170px;height:auto;">
</div>
    <nav>
      <a href="#about">À propos</a>
      <a href="#projects">Projets</a>
      <a href="#services">Prestations</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <h1>L'immersion<br>autrement.</h1>
    <img class="logo" src="rshift-logo.png" alt="Logo RSHIFT">
  </main>
  <script>
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      particles = Array.from({length: 180}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 5 + 1,
        speed: Math.random() * 0.6 + 0.1,
        alpha: Math.random() * 0.6 + 0.15
      }));
    }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(75,190,255,${p.alpha})`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#38aaff";
        ctx.fill();
        p.y -= p.speed;
        if (p.y < -10) p.y = canvas.height + 10;
      }
      requestAnimationFrame(animate);
    }
    addEventListener("resize", resize);
    resize();
    animate();
  </script>
</body>
</html>
